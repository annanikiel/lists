<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Lists</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="css/app.css">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
  <h1>Lists</h1>
  <p class="hint">A fresh task list each day, and a shopping list for the shop.</p>

  <a class="card" id="open-list" href="#">
    <strong>Current list</strong><br/>
    <small id="open-detail">No list yet</small>
  </a>

  <a class="card" id="new-list" href="#">
    <strong>New list</strong><br/>
    <small>Clear everything and start fresh</small>
  </a>

  <a class="card" id="shopping" href="html/shopping.html">
    <strong>Shopping list</strong><br/>
    <small id="shopping-detail">No items yet</small>
  </a>

  <script src="js/store.js"></script>
  <script>
    const openCard = document.getElementById('open-list');
    const openDetail = document.getElementById('open-detail');

    function render() {
      const list = loadList();
      if (!list) {
        openCard.classList.add('disabled');
        openDetail.textContent = 'No list yet — start a new one';
        return;
      }
      openCard.classList.remove('disabled');
      const total = list.items.length;
      const done = list.items.filter(i => i.done).length;
      openDetail.textContent = total === 0
        ? 'No items yet'
        : done + ' of ' + total + ' done';
    }

    function renderShopping() {
      const shop = loadShopping();
      const total = shop ? shop.items.length : 0;
      const done = shop ? shop.items.filter(i => i.done).length : 0;
      document.getElementById('shopping-detail').textContent =
        total === 0 ? 'No items yet'
          : done === total ? 'Ready for the checkout'
          : done + ' of ' + total + ' ticked off';
    }

    openCard.addEventListener('click', e => {
      e.preventDefault();
      if (!loadList()) return;
      window.location.href = 'html/list.html';
    });

    document.getElementById('new-list').addEventListener('click', e => {
      e.preventDefault();
      const list = loadList();
      if (list && list.items.length > 0) {
        const ok = confirm('This clears your current list of ' + list.items.length +
          ' item' + (list.items.length === 1 ? '' : 's') + '. Start a new one?');
        if (!ok) return;
      }
      newList();
      window.location.href = 'html/list.html';
    });

    render();
    renderShopping();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
