<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>List</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>
  <a href="../index.html">← Home</a>

  <header class="page-header">
    <div>
      <h1 id="title">Today</h1>
      <p class="hint" id="subtitle">Tick an item to move it to the bottom.</p>
    </div>
  </header>

  <div class="toolbar">
    <label class="field" for="sort">
      Sort by
      <select id="sort">
        <option value="priority">Priority</option>
        <option value="tag">Tag</option>
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
      </select>
    </label>
    <span class="spacer"></span>
    <span class="hint" id="progress"></span>
  </div>

  <button class="primary" type="button" id="add-toggle">+ Add item</button>

  <form class="add-form" id="add-form" hidden>
    <div class="row">
      <input type="text" id="item-text" placeholder="What needs doing?" autocomplete="off" required />
    </div>
    <div class="row">
      <label class="field" for="item-tag">
        Tag
        <select id="item-tag">
          <option value="">No tag</option>
        </select>
      </label>
      <label class="field" for="item-priority">
        Priority
        <select id="item-priority">
          <option value="high">High</option>
          <option value="medium" selected>Medium</option>
          <option value="low">Low</option>
        </select>
      </label>
      <span class="spacer"></span>
      <button type="button" id="add-cancel">Cancel</button>
      <button class="primary" type="submit">Add item</button>
    </div>
  </form>

  <div class="list" id="list"></div>

  <script src="../js/store.js"></script>
  <script src="../js/list.js"></script>
</body>
</html>
