<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Shopping list</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>
  <a href="../index.html">← Home</a>

  <header class="page-header">
    <div>
      <h1>Shopping list</h1>
      <p class="hint">Tick things off as they go in the trolley.</p>
    </div>
  </header>

  <button class="primary" type="button" id="add-toggle">+ Add item</button>

  <form class="add-form" id="add-form" hidden>
    <div class="row">
      <input type="text" id="item-text" placeholder="What do you need?" autocomplete="off" required />
    </div>
    <div class="row">
      <label class="field" for="item-tag">
        Tag
        <select id="item-tag">
          <option value="">No tag</option>
        </select>
      </label>
      <label class="field" for="item-price">
        Price
        <input type="number" id="item-price" placeholder="0.00" step="0.01" min="0" inputmode="decimal" />
      </label>
      <span class="spacer"></span>
      <button type="button" id="add-cancel">Cancel</button>
      <button class="primary" type="submit" id="add-submit">Add item</button>
    </div>
  </form>

  <div class="total" id="total" hidden></div>

  <div class="list" id="list"></div>

  <script src="../js/store.js"></script>
  <script src="../js/shopping.js"></script>
</body>
</html>
